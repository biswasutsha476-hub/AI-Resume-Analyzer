services:
  - type: web
    name: ai-resume-analyzer
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: node server.js

    envVars:
      - key: NODE_ENV
        value: production

      - key: GEMINI_MODEL
        value: gemini-3.6-flash

      - key: GEMINI_API_KEY
        sync: false

      - key: MONGODB_URI
        sync: false

      - key: JWT_SECRET
        generateValue: true