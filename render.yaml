services:
  - type: web
    name: ai-resume-analyzer
    rootDir: Digontom Pvt Ltd
    runtime: node
    plan: free
    buildCommand: npm run render-build
    startCommand: npm start
    healthCheckPath: /api/resumes/health

    envVars:
      - key: NODE_ENV
        value: production

      - key: GEMINI_MODEL
        value: gemini-3.6-flash

      - key: GEMINI_API_KEY
        sync: false

      - key: MONGODB_URI
        sync: false

      - key: JWT_SECRET
        generateValue: true